name: Lint PR Title

# Pull requests are merged with GitHub's "Squash and merge", which uses the pull request
# title as the commit message on master. Enforcing Conventional Commits on the title
# therefore enforces them on the history of master. Commits on the branch itself are
# squashed away and are not checked.
#
# See CONTRIBUTING.md for the convention.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize
  # Lint PR Title is a required check, so it must also report in the merge queue.
  merge_group:

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    name: Lint PR Title
    # Skipped in the merge queue: the title was already linted on the pull request,
    # and a skipped job counts as a passing required check.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-22.04
    steps:
      # Runs on `pull_request_target` so that the check also works for pull requests from
      # forks. This is safe because the workflow never checks out the pull request code.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Scopes are optional and unrestricted, e.g. `feat(loss): ...`.
          requireScope: false
