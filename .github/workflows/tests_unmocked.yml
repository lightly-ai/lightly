# Tests that run against the real API instead of mocks.
#
# These are not run automatically because they consume API quota, are slower (~10min)
# and can be flaky. Trigger them manually when changing the API client.
name: run unmocked tests

on: [workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
    - name: Set Up uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: 0.12.3
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Set Up Environment
      run: make install-maximal
    - name: Run Unmocked Tests
      # Passed via env rather than interpolated into the script to avoid injecting
      # secrets into the shell command.
      env:
        LIGHTLY_SERVER_LOCATION: ${{ secrets.LIGHTLY_SERVER_LOCATION }}
        LIGHTLY_TOKEN: ${{ secrets.DUMMY_USER_TOKEN_STAGING }}
      run: make test-unmocked
