name: Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-code-changes:
    name: Detect Code Changes
    runs-on: ubuntu-22.04
    outputs:
      run-tests: ${{ steps.filter.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: shell
          filters: |
            run-tests:
              - '!docs/**'
              - '!examples/**'
              - '!benchmarks/**'

  test:
    name: Test
    needs: detect-code-changes
    if: needs.detect-code-changes.outputs.run-tests == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set Up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.3
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set Up Environment
        run: make install-maximal-extras
      - name: Run Pytest
        run: make test-maximal-extras

  distributed-tests:
    name: Distributed Tests
    needs: detect-code-changes
    if: needs.detect-code-changes.outputs.run-tests == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set Up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.3
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set Up Environment
        run: make install-maximal-extras
      # Runs the @pytest.mark.DDP tests on the shared gloo pool (real multi-rank
      # collective, not mocked). See #1982.
      - name: Run Distributed Tests (gloo pool)
        run: make test-distributed
