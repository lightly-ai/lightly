name: Build and release lightly

on:
  # Started by the GitHub release that release.yml creates when the release pull request
  # is merged. workflow_dispatch republishes the latest tag after an infrastructure
  # failure.
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    # Build the tag of the release that started this run. On workflow_dispatch there is
    # no release, so fall back to the latest tag.
    - name: Checkout release tag
      id: checkout_latest_release_tag
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        TAG="${RELEASE_TAG:-$(git describe --tags `git rev-list --tags --max-count=1`)}"
        git checkout "$TAG"
        echo "tag_name=$TAG" >> $GITHUB_OUTPUT;
    - name: Set Up uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: 0.12.3
    # This job builds the release tag that was checked out above, not the default
    # branch, so it deliberately avoids `make` targets and dependency groups: those
    # only exist in the tag's own Makefile/pyproject.toml. `uv build` needs nothing
    # but [build-system], and `uvx` installs twine into a throwaway environment.
    - name: Build and release
      id: build_and_release
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USER_NAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        uv build
        ls -l dist
        uvx twine upload dist/*
    - name: Convert success/failure strings to emojis
      id: emoji_status
      run: |
        function set-emoji-output {
          if [ "$2" == "success" ];
          then echo "$1=:github-check-mark:" >> $GITHUB_OUTPUT;
          else echo "$1=:github-changes-requested:" >> $GITHUB_OUTPUT;
          fi
        }
        set-emoji-output status ${{ steps.build_and_release.outcome }}
    - name: Slack notification
      if: always()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_RELEASES }}
        SLACK_ICON_EMOJI: ":python:"
        SLACK_USERNAME: Release of Lightly PIP Package ${{steps.checkout_latest_release_tag.outputs.tag_name}}
        SLACK_COLOR: ${{ steps.build_and_release.outcome }}
        SLACK_FOOTER: ""
        SLACK_MESSAGE: |
          Release status: ${{steps.emoji_status.outputs.status}}
          https://pypi.org/project/lightly/${{steps.checkout_latest_release_tag.outputs.tag_name}}
