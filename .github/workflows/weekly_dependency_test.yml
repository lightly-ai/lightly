# Tests the package against the latest version of all dependencies. This catches
# breakage from new dependency releases before users hit it, since the regular test
# workflows pin dependencies to a fixed cutoff date.
name: Weekly Dependency Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * THU'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LIGHTLY_SERVER_LOCATION: "localhost:-1"

jobs:
  test_fresh_install:
    name: Test Fresh Install
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
    - name: Set Up uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: 0.12.3
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Set Up Environment
      run: make install-latest
    - name: Run Tests
      id: run_tests
      run: make test-latest
    - name: Slack notification
      if: always()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_NIGHTLY }}
        SLACK_ICON_EMOJI: ":github:"
        SLACK_USERNAME: Lightly PIP Package ${{ github.workflow }}
        SLACK_COLOR: ${{ steps.run_tests.outcome }}
        SLACK_FOOTER: ""
