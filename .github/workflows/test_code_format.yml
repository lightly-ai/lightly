name: Code Format Check

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
    - name: Set Up uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: 0.12.3
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    # Run lock-check before installing: `make install-maximal` runs `uv sync` (no
    # --frozen/--locked), which heals a stale uv.lock on disk and would hide the
    # staleness this check exists to catch.
    - name: Check Lockfile
      run: make lock-check
    - name: Set Up Environment
      run: make install-maximal MAXIMAL_PYTHON_VERSION=${{ matrix.python }}
    # ruff is exact-pinned in the dev group; mypy floats by interpreter (uv.lock pins
    # 1.14.1 on Python 3.8, 1.17.1 on >=3.9, since mypy >=1.15 dropped 3.8). The matrix
    # runs type-check under both interpreters to catch version-specific typing issues.
    - name: Run Format Check
      run: make format-check
    - name: Run Type Check
      run: make type-check
